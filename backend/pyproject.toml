[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "pawsafe-api"
version = "0.1.0"
description = "PawSafe Expo application backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.9,<3.0",
  "pydantic-settings>=2.5,<3.0",
  "networkx>=3.3,<4.0",
  "geopandas>=1.0,<2.0",
  "pyogrio>=0.9,<1.0",
  "pyproj>=3.6,<4.0",
  "shapely>=2.0,<3.0",
  "numpy>=1.26,<3.0",
  "pandas>=2.2,<3.0",
  "pyarrow>=17,<27",
  "scikit-learn>=1.9,<2.0",
  "joblib>=1.3,<2.0",
  "pysolar>=0.11,<1.0",
  "httpx>=0.27,<1.0",
  "PyYAML>=6.0,<7.0",
  "structlog>=24.4,<26.0",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11,<2.0",
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.24,<1.0",
  "ruff>=0.8,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
exclude = ["tests"]

[[tool.mypy.overrides]]
module = ["geopandas.*", "networkx.*", "yaml.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["app.model_runtime.pawsafe_12day.*"]
ignore_errors = true
